<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum · Paper Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311141b'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%233ee6a8' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #090b10;
  --bg-2: #0d1017;
  --card: #11151d;
  --card-2: #151a24;
  --line: #1e2431;
  --line-2: #2a3242;
  --text: #e8ecf3;
  --text-2: #9aa4b6;
  --text-3: #626d80;
  --up: #3ee6a8;
  --up-soft: rgba(62,230,168,.12);
  --down: #ff5d73;
  --down-soft: rgba(255,93,115,.12);
  --brand: #8b7cff;
  --brand-soft: rgba(139,124,255,.14);
  --warn: #ffb547;
  --warn-soft: rgba(255,181,71,.13);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  --radius: 14px;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f6fa; --bg-2: #eef1f6; --card: #ffffff; --card-2: #f7f9fc;
  --line: #e3e8f0; --line-2: #d3dae6; --text: #121826; --text-2: #4d5a70; --text-3: #8a95a8;
  --up: #0fae74; --up-soft: rgba(15,174,116,.11); --down: #e23a55; --down-soft: rgba(226,58,85,.1);
  --brand: #6a57f0; --brand-soft: rgba(106,87,240,.1); --warn: #c77a00; --warn-soft: rgba(199,122,0,.1);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(1200px 500px at 85% -120px, var(--brand-soft), transparent 60%),
                    radial-gradient(900px 400px at -10% -80px, var(--up-soft), transparent 60%);
  background-repeat: no-repeat;
  color: var(--text); font: 14px/1.45 var(--sans); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--text-2); } .faint { color: var(--text-3); }

/* ── header ───────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom: 1px solid var(--line);
}
.bar { max-width: 1480px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand), var(--up)); box-shadow: 0 4px 18px var(--brand-soft); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.pill.paper { background: var(--warn-soft); color: var(--warn); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.status { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; min-width: 0; }
.status .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.live { background: var(--up); box-shadow: 0 0 0 0 var(--up); animation: pulse 2s infinite; }
.dot.demo { background: var(--brand); box-shadow: 0 0 0 0 var(--brand); animation: pulse 2s infinite; }
.dot.err { background: var(--down); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent), 0 0 0 0 rgba(62,230,168,.5);} 70% { box-shadow: 0 0 0 8px rgba(0,0,0,0);} 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0);} }
.spacer { flex: 1; }
.actions { display: flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: .15s; white-space: nowrap; }
a.btn { text-decoration: none; }
.btn:hover { border-color: var(--text-3); background: var(--card-2); }
.btn.primary { background: var(--up); border-color: var(--up); color: #04130d; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.violet { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.violet:hover { filter: brightness(1.1); }
.btn.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, transparent); background: var(--down-soft); }
.btn.icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--brand-soft); color: var(--brand); }

main { max-width: 1480px; margin: 0 auto; padding: 22px 24px 60px; }

/* ── cards & grid ─────────────────────────────── */
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.row2 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
.card-h h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; text-transform: uppercase; }
.card-h .count { font-size: 12px; color: var(--text-3); font-weight: 500; }
.card-b { padding: 14px 18px 18px; }
.section { margin-top: 16px; }

.kpi { padding: 16px 18px; position: relative; overflow: hidden; }
.kpi .label { color: var(--text-2); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 24px; font-weight: 600; margin-top: 6px; letter-spacing: -.02em; white-space: nowrap; }
.kpi .value small { font-size: 12px; color: var(--text-3); font-weight: 500; margin-left: 3px; }
.kpi .sub { font-size: 12px; color: var(--text-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .kspark { position: absolute; right: 12px; top: 14px; opacity: .9; }
.wl { display: flex; height: 6px; border-radius: 4px; overflow: hidden; margin-top: 10px; background: var(--line); }
.wl i { display: block; height: 100%; }
.slots { display: flex; gap: 5px; margin-top: 10px; }
.slots i { width: 18px; height: 6px; border-radius: 3px; background: var(--line-2); }
.slots i.on { background: var(--brand); box-shadow: 0 0 10px var(--brand-soft); }
.meter { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--up)); border-radius: 4px; }

/* ── chart ────────────────────────────────────── */
.chart-wrap { position: relative; height: 250px; }
.chart-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart-tip { position: absolute; pointer-events: none; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -115%); box-shadow: var(--shadow); display: none; }
.legend-inline { display: flex; gap: 14px; font-size: 12px; color: var(--text-3); margin-left: auto; }

/* ── funnel & reasons ─────────────────────────── */
.funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fstep { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.fstep b { display: block; font-size: 18px; font-weight: 600; }
.fstep span { font-size: 11.5px; color: var(--text-3); }
.reasons { margin-top: 16px; display: grid; gap: 9px; }
.secline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; }
.rgroup { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--text-3); margin-top: 6px; }
.reason { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; }
.reason .bar2 { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.reason .bar2 i { display: block; height: 100%; background: color-mix(in srgb, var(--text-3) 70%, transparent); border-radius: 3px; }

/* ── positions ────────────────────────────────── */
.positions { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.pos { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; position: relative; overflow: hidden; }
.pos::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--pc, var(--text-3)); }
.pos-top { display: flex; align-items: flex-start; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.tkn { min-width: 0; }
.tkn b { display: block; font-size: 14.5px; }
.tkn span { display: block; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gain { margin-left: auto; text-align: right; }
.gain b { font-size: 20px; font-weight: 600; display: block; }
.gain span { font-size: 12px; }
.pos .spark { margin: 10px 0 6px; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--line); margin: 16px 0 22px; }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.track .mk { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--line-2); border-radius: 1px; }
.track .mk.done { background: var(--up); }
.track .mk.stop { background: var(--down); }
.track .mk label { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--text-3); white-space: nowrap; font-family: var(--mono); }
.track .now { position: absolute; top: -5px; width: 18px; height: 18px; border-radius: 50%; transform: translateX(-50%);
  background: var(--card); border: 3px solid var(--pc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 20%, transparent); transition: left .6s ease; }
.pos-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12px; }
.pos-stats div span { display: block; color: var(--text-3); font-size: 11px; }
.pos-stats div b { font-weight: 500; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.up { background: var(--up-soft); color: var(--up); }
.badge.down { background: var(--down-soft); color: var(--down); }
.badge.brand { background: var(--brand-soft); color: var(--brand); }
.badge.gray { background: var(--line); color: var(--text-2); }
.links { display: flex; gap: 10px; margin-top: 10px; font-size: 12px; }
.links a { color: var(--text-3); text-decoration: none; } .links a:hover { color: var(--text); }
.empty { text-align: center; padding: 34px 16px; color: var(--text-3); font-size: 13px; }
.empty .ico { font-size: 22px; margin-bottom: 6px; opacity: .7; }

/* ── watchlist ────────────────────────────────── */
.tbl-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .15s; }
tbody tr:hover { background: var(--card-2); }
tr.pending td { background: var(--brand-soft); }
th.r, td.r { text-align: right; }
.tk { display: flex; align-items: center; gap: 9px; }
.tk .avatar { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; }
.tklink { text-decoration: none; color: inherit; border-radius: 8px; }
a.tklink[href] { cursor: pointer; }
a.tklink[href]:hover b { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.tklink .ext { font-size: 10px; color: var(--text-3); display: inline; }
.subnum { display: block; font-size: 11px; color: var(--text-3); font-weight: 400; }
td.mc b { font-weight: 500; }
.tk b { font-size: 13px; } .tk span { display: block; font-size: 11.5px; color: var(--text-3); max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.checks { display: inline-flex; gap: 3px; }
.checks i { width: 9px; height: 16px; border-radius: 3px; background: var(--line-2); position: relative; cursor: help; }
.checks i.ok { background: var(--up); }
.checks i.no { background: color-mix(in srgb, var(--down) 55%, var(--line-2)); }
.checks .sep { width: 6px; }
.checks .trig { font: 600 9.5px var(--mono); color: var(--text-3); margin: 0 2px 0 4px; align-self: center; }
.checks .trig.on { color: var(--brand); }
.tip .tgroup { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 8px 0 3px; font-weight: 600; display: flex; justify-content: space-between; }
.tip .tgroup b { color: var(--up); font-weight: 600; }
.ring { --p: 0; width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--line) 0); vertical-align: middle; }
.ring::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--card); grid-area: 1/1; }
.ring span { grid-area: 1/1; z-index: 1; font-size: 9.5px; font-family: var(--mono); color: var(--text-2); }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 10px;
  padding: 10px 12px; font-size: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.35); display: none; min-width: 230px; }
.tip .trow { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
.tip .trow .ok { color: var(--up); } .tip .trow .no { color: var(--down); }

/* ── activity ─────────────────────────────────── */
.feed { max-height: 560px; overflow-y: auto; margin: 0 -18px; padding: 0 18px; }
.feed-filters { display: flex; gap: 6px; margin-left: auto; }
.chip { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--text-3); }
.chip.on { color: var(--text); background: var(--card-2); }
.ev { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ev:last-child { border-bottom: 0; }
.ev.fresh { animation: slidein .5s ease; }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.ev .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; }
.ev .ic.signal { background: var(--brand-soft); color: var(--brand); }
.ev .ic.buy { background: var(--up-soft); color: var(--up); }
.ev .ic.sell { background: var(--warn-soft); color: var(--warn); }
.ev .ic.close-up { background: var(--up-soft); color: var(--up); }
.ev .ic.close-down { background: var(--down-soft); color: var(--down); }
.ev .ic.reject { background: var(--line); color: var(--text-3); }
.ev .t b { font-size: 13px; } .ev .t p { margin: 1px 0 0; font-size: 12px; color: var(--text-2); }
.ev .when { font-size: 11px; color: var(--text-3); white-space: nowrap; }

/* ── hero / empty state ───────────────────────── */
.hero { padding: 42px 32px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; }
.hero h1 { font-size: 30px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -.03em; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--brand), var(--up)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--text-2); margin: 0 0 22px; max-width: 520px; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .cta .btn { padding: 11px 18px; font-size: 14px; }
.steps { display: grid; gap: 10px; }
.step { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.step i { font-style: normal; width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--brand-soft); color: var(--brand); }
.step b { display: block; font-size: 13.5px; } .step span { font-size: 12.5px; color: var(--text-2); }
.notice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px;
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); font-size: 13px; }
.notice b { color: var(--warn); }
.notice .btn { margin-left: auto; }

/* ── drawer ───────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(3,5,10,.55); z-index: 40; opacity: 0; pointer-events: none; transition: .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 50; background: var(--bg-2); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer-h h3 { margin: 0; font-size: 16px; }
.drawer-b { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
.drawer-f { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
.fgroup h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 22px 0 10px; font-weight: 600; }
.field { display: grid; grid-template-columns: 1fr 150px; align-items: center; gap: 10px; padding: 6px 0; }
.field label { font-size: 13px; color: var(--text-2); }
.field.wide { grid-template-columns: 1fr; gap: 6px; }
.field label em { font-style: normal; font-size: 10.5px; color: var(--warn); margin-left: 6px; }
.inp { position: relative; }
.inp input, .inp select, .keyrow input { width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 10px; color: var(--text);
  font: 13px var(--mono); outline: none; transition: border-color .15s; }
.inp input:focus, .inp select:focus, .keyrow input:focus { border-color: var(--brand); }
.inp .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-3); pointer-events: none; font-family: var(--sans); }
.inp input.has-unit { padding-right: 42px; }
.inp select { font-family: var(--sans); appearance: none; }
.keybox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
.keybox p { margin: 6px 0 10px; font-size: 12.5px; color: var(--text-2); }
.keyrow { display: flex; gap: 8px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--card-2); border: 1px solid var(--line-2);
  padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 70; opacity: 0; transition: .25s; box-shadow: var(--shadow); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
footer { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 30px; }


/* ── wallet lab ───────────────────────────────── */
.drawer.wide { width: min(820px, 100vw); }
.labform { display: grid; grid-template-columns: 1fr 150px auto; gap: 8px; margin-top: 16px; }
.labform input, .labform select { background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 11px; color: var(--text); font: 13px var(--mono); outline: none; min-width: 0; }
.labform select { font-family: var(--sans); }
.labform input:focus, .labform select:focus { border-color: var(--brand); }
.lab-intro { color: var(--text-2); font-size: 13px; margin: 4px 0 0; }
.lab-progress { margin-top: 16px; }
.lab-progress .meter { height: 8px; }
.lab-progress p { font-size: 12.5px; color: var(--text-2); margin: 8px 0 0; }
.lab-err { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--down-soft); color: var(--down); font-size: 13px; }
.lab-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.lab-kpis .k { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.lab-kpis .k span { display: block; font-size: 11.5px; color: var(--text-3); }
.lab-kpis .k b { font-size: 19px; font-weight: 600; }
.lab-flags { display: grid; gap: 8px; margin-top: 14px; }
.lab-flag { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; border: 1px solid var(--line); background: var(--card); }
.lab-flag b { white-space: nowrap; }
.lab-flag.good b { color: var(--up); } .lab-flag.warn b { color: var(--warn); } .lab-flag.info b { color: var(--text-2); }
.lab-sec { margin-top: 20px; }
.lab-sec h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 0 0 8px; font-weight: 600; }
.lab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lab-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lab-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; padding: 3px 0; }
.lab-row span { color: var(--text-2); } .lab-row b { font-weight: 500; text-align: right; }
.bk { display: grid; grid-template-columns: 70px 1fr 42px; gap: 8px; align-items: center; font-size: 11.5px; padding: 2px 0; color: var(--text-2); }
.bk i { display: block; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bk i em { display: block; height: 100%; border-radius: 4px; }
.bk b { text-align: right; font-weight: 500; font-family: var(--mono); }
.lab-actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.prev { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
@media (max-width: 720px) { .lab-kpis { grid-template-columns: repeat(2, 1fr); } .lab-grid { grid-template-columns: 1fr; } .labform { grid-template-columns: 1fr 1fr; } .labform input { grid-column: 1 / -1; } }

.wtab { width: 100%; font-size: 12px; border-collapse: collapse; margin-bottom: 10px; }
.wtab td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.wtab td.lbl { color: var(--text-2); width: 42%; }
.wtab .share { display: flex; align-items: center; gap: 6px; }
.wtab .share i { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.wtab .share em { display: block; height: 100%; background: var(--brand); }
.wtitle { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; font-weight: 600; }

/* ── real money ───────────────────────────────── */
#realmoney .card { border-color: color-mix(in srgb, var(--up) 35%, var(--line)); margin-bottom: 16px; }
.rm-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px 0; }
.rm-head h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--up); }
.rm-addr { font: 12px var(--mono); color: var(--text-2); background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.rm-bal { font-size: 13px; }
.rm-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.rm-actions .btn { padding: 6px 11px; font-size: 12.5px; }
.rm-events { margin-top: 10px; display: grid; gap: 4px; font-size: 12px; max-height: 150px; overflow-y: auto; }
.rm-events div { display: flex; gap: 8px; } .rm-events .t { color: var(--text-3); white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.rm-events .error { color: var(--down); } .rm-events .skip { color: var(--text-3); }
/* ── responsive ───────────────────────────────── */
@media (max-width: 1250px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1000px) {
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: 1fr; }
  .status .txt { max-width: 180px; }
}
@media (max-width: 720px) {
  .bar { padding: 10px 16px; flex-wrap: wrap; gap: 10px; }
  .status { order: 3; width: 100%; }
  .spacer { display: none; }
  .actions { margin-left: auto; }
  .brand .pill { display: none; }
  main { padding: 16px 16px 50px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 13px 14px; }
  .kpi .value { font-size: 19px; }
  .kpi .kspark { display: none; }
  .hero { padding: 26px 20px; }
  .hero h1 { font-size: 24px; }
  .positions { grid-template-columns: 1fr; }
  .funnel { grid-template-columns: repeat(2, 1fr); }
  .hide-sm { display: none; }
  .actions .btn .lbl { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 17l6-7 4 3 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      Momentum
      <span class="pill paper" id="modePill">PAPER TRADING</span>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span class="txt" id="statusTxt">Connecting to app…</span><span class="faint num" id="uptime"></span></div>
    <div class="spacer"></div>
    <div class="actions" id="actions"></div>
  </div>
</header>

<main>
  <div id="notice"></div>
  <section id="realmoney"></section>
  <div id="hero"></div>
  <div id="dash" hidden>
    <section class="grid kpis" id="kpis"></section>

    <section class="grid row2">
      <div class="card">
        <div class="card-h"><h2>Equity</h2><div class="legend-inline" id="eqLegend"></div></div>
        <div class="card-b"><div class="chart-wrap" id="eqChart"></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Filter funnel</h2></div>
        <div class="card-b"><div class="funnel" id="funnel"></div><div class="reasons" id="reasons"></div></div>
      </div>
    </section>

    <section class="card section">
      <div class="card-h"><h2>Open positions</h2><span class="count" id="posCount"></span></div>
      <div class="card-b"><div class="positions" id="positions"></div></div>
    </section>

    <section class="grid row2">
      <div class="card">
        <div class="card-h"><h2>Watchlist</h2><span class="count" id="watchCount"></span></div>
        <div class="card-b"><div class="tbl-wrap"><table id="watch"></table></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Activity</h2>
          <div class="feed-filters">
            <button class="chip on" data-f="trades">Trades</button>
            <button class="chip" data-f="all">All</button>
          </div>
        </div>
        <div class="card-b"><div class="feed" id="feed"></div></div>
      </div>
    </section>

    <section class="card section">
      <div class="card-h"><h2>Trade history</h2><span class="count" id="histCount"></span></div>
      <div class="card-b"><div class="tbl-wrap"><table id="hist"></table></div></div>
    </section>
    <footer>Paper trading only · no wallet, no private key, no real orders · not financial advice</footer>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Settings">
  <div class="drawer-h"><h3>Strategy settings</h3><div class="spacer"></div><button class="btn icon" id="closeDrawer" aria-label="Close">✕</button></div>
  <div class="drawer-b" id="settingsBody"></div>
  <div class="drawer-f">
    <button class="btn" id="resetSettings">Reset to defaults</button>
    <div class="spacer"></div>
    <button class="btn primary" id="saveSettings">Save changes</button>
  </div>
</aside>
<aside class="drawer wide" id="lab" aria-label="Wallet Lab">
  <div class="drawer-h"><h3>🔬 Wallet Lab</h3><div class="spacer"></div><button class="btn icon" onclick="closeLab()" aria-label="Close">✕</button></div>
  <div class="drawer-b" id="labBody"></div>
</aside>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let LIVE = null, S = null, META = null, feedFilter = "trades", seenEv = new Set(), firstFeed = true, hover = null;

/* theme */
try { const t = localStorage.getItem("mm-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = cur;
  try { localStorage.setItem("mm-theme", cur); } catch (e) {}
  render();
}

/* formatting */
const sol = (v, d = 3) => (v == null ? "—" : Number(v).toFixed(d));
const signed = (v, d = 3) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const pct = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
const cls = v => (v > 0 ? "up" : v < 0 ? "down" : "muted");
const dur = s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + "s"; const m = Math.floor(s / 60); if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s"; return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const ago = s => s < 5 ? "now" : s < 60 ? Math.round(s) + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago";
const usdOf = solAmt => (META?.sol_usd && solAmt != null) ? solAmt * META.sol_usd : null;
const usd = v => v == null ? "" : "$" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toFixed(0));
const mcapCell = sol => { const u = usdOf(sol); return u != null ? `<b class="num">${usd(u)}</b><span class="subnum num">${sol.toFixed(0)} SOL</span>` : `<b class="num">${sol.toFixed(0)}</b><span class="subnum">SOL</span>`; };
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(sym, mint) { const h = hue(mint || sym); return `<div class="avatar" style="background:linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h + 50) % 360} 75% 45%))">${esc((sym || "?").slice(0, 2))}</div>`; }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* tiny sparkline */
function spark(pts, w = 120, h = 34, color, baseline) {
  if (!pts || pts.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if (baseline != null) { lo = Math.min(lo, baseline); hi = Math.max(hi, baseline); }
  const r = hi - lo || 1, pad = 2;
  const X = i => (i / (pts.length - 1)) * w, Y = v => h - pad - ((v - lo) / r) * (h - pad * 2);
  const d = pts.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
  const id = "g" + Math.random().toString(36).slice(2, 8);
  const c = color || (pts[pts.length - 1] >= pts[0] ? "var(--up)" : "var(--down)");
  const base = baseline != null ? `<line x1="0" x2="${w}" y1="${Y(baseline)}" y2="${Y(baseline)}" stroke="var(--text-3)" stroke-dasharray="3 3" stroke-width="1" opacity=".6"/>` : "";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;max-width:${w}px">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${base}<path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ── API ─────────────────────────────────── */
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function start(mode) {
  if (mode === "live" && !META?.has_key) { openDrawer(true); toast("Add your PumpPortal API key to run live paper trading"); return; }
  if (S?.stats?.closed && !confirm("Starting again begins a fresh session. Your past trades stay saved in the data folder. Continue?")) return;
  try { META = await api("/api/start", { mode, speed: 3 }); firstFeed = true; seenEv.clear(); toast(mode === "demo" ? "Demo started · synthetic tokens" : "Live paper trading started"); render(); }
  catch (e) { toast(e.message); }
}
async function stop() { try { META = await api("/api/stop", {}); toast("Stopped · open positions closed at market"); render(); } catch (e) { toast(e.message); } }
async function setSpeed(s) { try { META = await api("/api/speed", { speed: s }); render(); } catch (e) {} }

/* ── socket ──────────────────────────────── */
let lastMsg = 0;
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = m => { const j = JSON.parse(m.data); META = j.meta; S = j.data; LIVE = j.live; lastMsg = Date.now(); render(); };
  ws.onclose = () => { META = null; renderHeader(true); setTimeout(connect, 1500); };
}
connect();

/* ── render ──────────────────────────────── */
function render() { renderHeader(); renderBody(); renderLive(); }

function renderHeader(lost) {
  const dot = $("#dot"), txt = $("#statusTxt"), up = $("#uptime");
  if (lost || !META) { dot.className = "dot err"; txt.textContent = "App not reachable. Is app.py running?"; up.textContent = ""; $("#actions").innerHTML = ""; return; }
  dot.className = "dot " + (META.running ? (META.mode === "demo" ? "demo" : (META.connected ? "live" : "err")) : "");
  txt.textContent = META.running ? (META.mode === "demo" ? META.status : (META.connected ? "Live · streaming pump.fun" : META.status)) : "Stopped";
  up.textContent = META.running && META.started_at ? "· " + dur(Date.now() / 1000 - META.started_at) : "";
  const gear = `<button class="btn icon" onclick="openDrawer()" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>`;
  const theme = `<button class="btn icon" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">${document.documentElement.dataset.theme === "light" ? "☾" : "☀"}</button>`;
  let a;
  if (META.running) {
    const speed = META.mode === "demo" ? `<div class="seg hide-sm">${[1, 3, 10].map(s => `<button class="${META.speed === s ? "on" : ""}" onclick="setSpeed(${s})">${s}×</button>`).join("")}</div>` : "";
    a = `${speed}<button class="btn danger" onclick="stop()"><svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2" fill="currentColor"/></svg><span class="lbl">Stop</span></button>`;
  } else {
    a = `<button class="btn" onclick="start('demo')"><span>◇</span><span class="lbl">Demo</span></button>
         <button class="btn primary" onclick="start('live')"><svg width="11" height="12" viewBox="0 0 11 12"><path d="M0 0l11 6-11 6z" fill="currentColor"/></svg><span class="lbl">Start live</span></button>`;
  }
  const labBtn = `<button class="btn" onclick="openLab()" title="Analyze a wallet's trading"><span>🔬</span><span class="lbl">Wallet Lab</span></button>
    <a class="btn icon" href="/api/diagnostics" title="Download diagnostics (trades, copy log, settings - never your wallet key)" aria-label="Download diagnostics">⬇</a>`;
  $("#actions").innerHTML = a + labBtn + theme + gear;
}

function renderBody() {
  const hasData = S && (META?.running || S.stats.closed || S.positions.length);
  // notices
  let n = "";
  if (META && !META.has_key && !(META.running && META.mode === "demo") && hasData)
    n = `<div class="notice"><span>🔑</span><div><b>No API key.</b> Live mode can see launches but not their trades, so it can't find entries.</div><button class="btn" onclick="openDrawer(true)">Add key</button></div>`;
  if (META?.running && META.mode === "demo")
    n = `<div class="notice" style="background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent)"><span>◇</span><div><b style="color:var(--brand)">Demo mode.</b> Every token here is synthetic. Use it to learn the dashboard, not to judge the strategy.</div></div>`;
  if (META?.running && META.mode === "live" && META.rugcheck_errors >= 5 && META.rugcheck_errors / Math.max(1, META.rugcheck_checks) > 0.3 && S?.stats?.rugcheck)
    n += `<div class="notice"><span>🛡</span><div><b>RugCheck isn't responding reliably</b> (${META.rugcheck_errors} of ${META.rugcheck_checks} checks failed${META.rugcheck_last_error ? ", last: " + esc(META.rugcheck_last_error) : ""}). ${META.rugcheck_on_error === "allow" ? "Tokens it can't check are being watched without it." : "Tokens it can't check are being skipped, so you may see very few trades."}</div><button class="btn" onclick="openDrawer()">Settings</button></div>`;
  const C = S?.copy;
  if (C && C.wallets && C.wallets.length && META?.running) {
    const ws = C.wallets.map(w => w.slice(0, 4) + "…" + w.slice(-4)).join(", ");
    const waiting = META.mode === "live" && !(C.wallet_buys || C.wallet_sells);
    const B = C.backup;
    const detail = waiting ? "waiting for its next trade…" :
      `wallet bought ${C.wallet_buys || 0}× · sold ${C.wallet_sells || 0}×` +
      (C.older_sells ? ` <span class="faint">(${C.older_sells} of those were positions it opened before we started, not copied)</span>` : "") +
      ` · we copied ${C.copied_buys || 0} buys and mirrored ${C.mirrored_sells || 0} sells · ${C.open} open · ${C.closed} closed <span class="num ${cls(C.pnl)}">${signed(C.pnl, 4)} SOL</span>`;
    const backup = META.mode !== "live" ? "" : B ? `<div class="faint" style="font-size:12px;margin-top:3px">${B.fast_on ? `⚡ Fast wallet feed connected${B.fast ? ` · ${B.fast} trades caught${B.fast_lag_s != null ? ` (last ${B.fast_lag_s}s after it happened)` : ""}` : ""} · ` : `<span style="color:var(--warn)">⚡ Fast wallet feed connecting…</span> · `}🛡 On-chain backup active · ${B.recovered} missed trades recovered · ${B.resolved} amounts looked up${B.errors ? ` · ${B.errors} errors (${esc(B.last_error)})` : ""}</div>`
      : `<div style="font-size:12px;margin-top:3px;color:var(--warn)">⚠ No Helius key, so there's no on-chain backup. Sells the live feed misses or sends without amounts may not be mirrored. Add the key in Wallet Lab, then restart.</div>`;
    const PW = C.per_wallet || {};
    const gapTxt = g => g == null ? "—" : `<span class="${g > 5 ? "down" : g < -2 ? "up" : ""}">${g > 0 ? "+" : ""}${g}%</span>`;
    const SN = C.snaps;
    const snapLine = META.mode === "live" && SN ? `<div class="faint" style="font-size:12px;margin-top:3px" title="Research for a lookalike strategy: what tokens looked like when the wallet bought, vs tokens it skipped. Saved to data/snapshots.jsonl and included in ⬇ diagnostics.">📸 Snapshots · ${SN.wallet_buys} wallet buys · ${SN.compared} comparison tokens (at ${SN.cross_mcap_sol} SOL mcap) · ${SN.outcomes} outcomes checked${SN.errors ? ` · ${SN.errors} errors (${esc(SN.last_error)})` : ""}</div>` : "";
    const board = Object.keys(PW).length ? `<table class="wtab" style="margin:8px 0 2px;background:var(--card);border-radius:8px"><tr class="faint"><td>Wallet</td><td class="r" title="Trades by this wallet seen via the live feed / via the on-chain backup">Seen (feed / chain)</td><td class="r">Last trade</td><td class="r">Open</td><td class="r">Closed</td><td class="r">Win</td><td class="r">Realized</td><td class="r">Open P&L</td><td class="r" title="How much higher our buy price was than the wallet's (the cost of copying 1.5s late)">Entry gap</td><td class="r" title="Our sell price vs the wallet's sell price (negative = we sold lower)">Exit gap</td></tr>
      ${Object.entries(PW).map(([k, v]) => `<tr><td class="num">${esc(k)}</td><td class="r num">${v.seen_live} / ${v.seen_chain}</td><td class="r num ${v.last_seen_s == null ? "faint" : ""}">${v.last_seen_s == null ? "none yet" : ago(v.last_seen_s)}</td><td class="r num">${v.open}</td><td class="r num">${v.closed}</td><td class="r num">${v.win_rate == null ? "—" : v.win_rate + "%"}</td>

function renderChart() {
  const el = $("#eqChart"), pts = S.equity, start = S.stats.start;
  const w = el.clientWidth || 600, h = el.clientHeight || 250, pl = 8, pr = 58, pt = 12, pb = 26;
  $("#eqLegend").innerHTML = `<span><span style="display:inline-block;width:16px;border-top:2px dashed var(--text-3);vertical-align:middle;margin-right:6px"></span>Starting balance</span>`;
  if (pts.length < 2) { el.innerHTML = `<div class="empty" style="padding-top:90px"><div class="ico">〰</div>The equity curve fills in as the bot runs</div>`; return; }
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals, start), hi = Math.max(...vals, start);
  const padv = (hi - lo) * 0.15 || 0.05; lo -= padv; hi += padv;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const X = t => pl + ((t - t0) / (t1 - t0 || 1)) * (w - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (h - pt - pb);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const last = vals[vals.length - 1], c = last >= start ? css("--up") : css("--down");
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    grid += `<line x1="${pl}" x2="${w - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${w - pr + 8}" y="${y + 4}" fill="var(--text-3)" font-size="11" font-family="var(--mono)">${v.toFixed(3)}</text>`;
  }
  const span = t1 - t0, ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + span * i / ticks, x = X(t);
    const lbl = i === ticks ? "now" : "−" + dur(t1 - t).replace(/ \d+s$/, "");
    grid += `<text x="${x}" y="${h - 6}" fill="var(--text-3)" font-size="11" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}">${lbl}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" id="eqSvg">
    <defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".3"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <line x1="${pl}" x2="${w - pr}" y1="${Y(start)}" y2="${Y(start)}" stroke="var(--text-3)" stroke-dasharray="4 4" stroke-width="1"/>
    <path d="${d} L${X(t1)} ${h - pb} L${X(t0)} ${h - pb}Z" fill="url(#eqg)"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(t1)}" cy="${Y(last)}" r="4" fill="${c}"/><circle cx="${X(t1)}" cy="${Y(last)}" r="9" fill="${c}" opacity=".18"/>
    <g id="eqHover" style="display:none"><line id="hx" y1="${pt}" y2="${h - pb}" stroke="var(--text-3)" stroke-width="1"/><circle id="hc" r="4" fill="var(--card)" stroke="${c}" stroke-width="2"/></g>
  </svg><div class="chart-tip" id="eqTip"></div>`;
  const svg = $("#eqSvg");
  const show = ev => {
    const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * (w / r.width);
    let best = 0, bd = 1e9; pts.forEach((p, i) => { const dd = Math.abs(X(p[0]) - mx); if (dd < bd) { bd = dd; best = i; } });
    const p = pts[best], x = X(p[0]), y = Y(p[1]);
    $("#eqHover").style.display = ""; $("#hx").setAttribute("x1", x); $("#hx").setAttribute("x2", x); $("#hc").setAttribute("cx", x); $("#hc").setAttribute("cy", y);
    const tip = $("#eqTip"); tip.style.display = "block"; tip.style.left = (x / w * r.width) + "px"; tip.style.top = (y / h * r.height) + "px";
    tip.innerHTML = `<b class="num">${p[1].toFixed(4)} SOL</b> <span class="${cls(p[1] - start)} num">${pct((p[1] - start) / start * 100, 2)}</span><br><span class="faint">${dur(t1 - p[0])} ago</span>`;
    hover = ev;
  };
  svg.addEventListener("mousemove", show);
  svg.addEventListener("mouseleave", () => { hover = null; $("#eqHover").style.display = "none"; $("#eqTip").style.display = "none"; });
  if (hover && document.elementFromPoint(hover.clientX, hover.clientY)?.closest("#eqSvg")) show(hover);
}

    const PW = L.per_wallet || {};
    if (Object.keys(PW).length) h += `<table class="wtab"><tr class="faint"><td>Copying</td><td class="r">Open</td><td class="r">In use / budget</td><td class="r">Closed</td><td class="r">Realized</td><td class="r">Open value</td></tr>
      ${Object.entries(PW).map(([k, v]) => `<tr><td class="num">${esc(k)}</td><td class="r num">${v.open}/${L.max_open}</td><td class="r num">${$u(v.deployed) || v.deployed} / $${L.budget_usd}</td>
        <td class="r num">${v.closed}${v.closed ? ` <span class="faint">(${v.wins}W)</span>` : ""}</td><td class="r num ${cls(v.realized)}">${signed(v.realized, 4)} SOL <span class="faint">${v.realized_usd != null ? "$" + v.realized_usd.toFixed(2) : ""}</span></td>
        <td class="r num">${v.open && v.open_value != null ? v.open_value.toFixed(4) + " SOL" : "—"}</td></tr>`).join("")}</table>`;
    if (L.positions.length) h += `<div class="tbl-wrap"><table><thead><tr><th>Token</th><th>Copying</th><th class="r">Cost</th><th class="r">Now worth</th><th class="r">Held</th><th>Status</th><th></th></tr></thead><tbody>
      ${L.positions.map(p => `<tr><td><a class="tklink" href="https://pump.fun/coin/${encodeURIComponent(p.mint)}" target="_blank" rel="noopener"><b>${esc(p.symbol)}</b> <span class="ext">↗</span></a>${p.name && p.name !== p.symbol ? `<div class="faint" style="font-size:11.5px">${esc(p.name)}</div>` : ""}</td>
        <td class="num">${esc(p.wallet)}</td><td class="r num">${p.sol_in.toFixed(4)}</td>
        <td class="r num ${p.value != null ? cls(p.value + p.sol_out - p.sol_in) : "faint"}">${p.value != null ? p.value.toFixed(4) : "—"}</td>
        <td class="r num">${p.left_pct != null ? p.left_pct + "%" : "—"}</td>
        <td>${p.status === "open" ? `<span class="badge up">open</span>` : `<span class="badge warn">${esc(p.status)}…</span>`} ${p.last_sig ? `<a class="faint" style="font-size:11px" href="https://solscan.io/tx/${p.last_sig}" target="_blank" rel="noopener">tx ↗</a>` : ""}</td>
        <td class="r"><button class="btn" style="padding:4px 9px;font-size:12px" onclick="liveSell('${p.mint}')" ${p.status === "open" ? "" : "disabled"}>Sell</button></td></tr>`).join("")}</tbody></table></div>`;
    else h += `<div class="faint" style="font-size:12.5px">No open real positions. Each copied buy is $${L.trade_usd}, up to ${L.max_open} per wallet and $${L.budget_usd} in use per wallet.</div>`;
    if (L.events.length) h += `<div class="rm-events">${L.events.slice(0, 12).map(e => `<div class="${e.kind}"><span class="t">${new Date(e.ts * 1000).toLocaleTimeString()}</span><span>${esc(e.text)}${e.sig ? ` <a class="faint" href="https://solscan.io/tx/${e.sig}" target="_blank" rel="noopener">↗</a>` : ""}</span></div>`).join("")}</div>`;
  }
  el.innerHTML = h + `</div></div>`;
}
async function liveCreate() {
  if (!confirm("Create a new trading wallet on this computer? You'll fund it with a small amount of SOL.")) return;
  try { const r = await api("/api/live/create_wallet", {}); navigator.clipboard?.writeText(r.address); toast("Wallet created. Address copied, send SOL to it"); } catch (e) { toast(e.message); }
}
async function livePause(p) { try { await api("/api/live/pause", { paused: p }); } catch (e) { toast(e.message); } }
async function liveSell(m) { if (!confirm("Sell this whole position now with real money?")) return; try { await api("/api/live/sell", { mint: m }); toast("Selling…"); } catch (e) { toast(e.message); } }
async function liveSellAll() { if (!confirm("Sell ALL real positions now?")) return; try { await api("/api/live/sell", { all: true }); toast("Selling everything…"); } catch (e) { toast(e.message); } }
async function liveWithdraw() {
  const a = prompt("Send the whole trading-wallet balance to which Solana address?\n(All positions must be sold first.)");
  if (!a) return;
  try { const r = await api("/api/live/withdraw", { address: a.trim() }); toast("Withdrawal sent"); } catch (e) { toast(e.message); }
}

let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2800); }
addEventListener("resize", () => S && renderChart());
setInterval(() => { if (META?.running && Date.now() - lastMsg > 4000) renderHeader(); }, 2000);
</script>
