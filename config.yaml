# ─────────────────────────────────────────────────────────────
#  Memecoin momentum bot — PAPER TRADING config
#  All amounts in SOL. Percentages are plain numbers (30 = 30%).
# ─────────────────────────────────────────────────────────────

feed:
  # PumpPortal API key. Required for per-token trade data (metered:
  # 0.01 SOL per 10,000 messages, billed to the wallet linked to the key).
  # New-token and migration events are free. Can also be set with the
  # PUMPPORTAL_API_KEY environment variable (preferred - keeps it out of this file).
  api_key: ""
  url: "wss://pumpportal.fun/api/data"
  trade_source: helius_poll            # helius_poll = read watched coins' prices on-chain (free with Helius);
                                       # pumpportal = PumpPortal's per-trade stream (0.01 SOL per 10,000 messages)
  poll_s: 3                            # helius_poll: seconds between reads (100 coins per request)

# Which tokens to watch:
#   new_tokens -> every fresh pump.fun launch (more chances, more rugs, more data cost)
#   migrated   -> only tokens that graduated to PumpSwap (far fewer, cheaper, less rug-heavy)
universe: new_tokens

# Which strategies run. Turn momentum off to test copy trading on its own.
strategies:
  momentum: true

# ── Copy trading: mirror another wallet on paper ────────────────
# When the wallet buys, we paper-buy the same token (our size, after our latency).
# When it sells, we sell the same share of our position. Needs the PumpPortal key
# (the wallet's trades are metered like any trade data, but it's a few hundred a day).
copy_trade:
  enabled: false
  wallet: ""                           # one address, or several separated by commas
  size_mode: match                     # match = same SOL as the wallet, scale = scale_pct of it, fixed = size_sol
  scale_pct: 10                        # used when size_mode is scale
  size_sol: 0.1                        # used when size_mode is fixed
  follow_adds: true                    # copy their extra buys into an open position (scaled, max 3x)
  follow_sells: true                   # mirror their sells proportionally
  max_open: 100                        # max copied positions open at once
  safety_stop_pct: 0                   # optional stop of our own (0 = pure mirror)
  max_hold_h: 0                        # optional time limit in hours (0 = pure mirror)
  max_entry_gap_pct: 15                # don't chase: don't buy while the price is more than this above what the wallet paid (0 = off)
  dip_wait_min: 10                     # real money: if it is, wait up to this long for a dip back to the limit (0 = just skip)
  dip_floor_pct: 10                    # ...but cancel if it falls this far below the wallet's price (coin dumping)

# ── Token snapshots (research for a "lookalike" strategy) ──────
# When a followed wallet buys, record what the token looked like; also record tokens the bot
# was watching as they rise through cross_mcap_sol, for comparison. Needs a Helius key.
snapshots:
  enabled: true
  cross_mcap_sol: 42                   # comparison tokens are snapshotted when they first reach this market cap
  min_age_s: 120                       # ...but only if at least this old (skips creator/bundle launch jumps)
  watch_s: 1800                        # with momentum off: watch new coins this long for comparison snapshots
  control_per_hour: 60                 # max comparison snapshots per hour (keeps Helius credits low)
  social: false                        # pump.fun comment count / livestream / KOTH - pump.fun now requires a login for this (HTTP 404), so off

# ── Lookalike (PAPER ONLY) ──────────────────────────────────────
# Wallet #1's entry (buy as a coin rises through ~44 SOL mcap) with our own exit plan.
# ── Lookalike · graduation exit (PAPER ONLY) ────────────────────
# Same entries as the lookalike; exits built around pump.fun graduation (~410 SOL mcap), like wallet #1.
lookalike_grad:
  enabled: true
  entry_mcap_sol: 44
  min_age_s: 300
  size_usd: 2.5
  max_open: 300
  stop_pct: 30                         # before 3x: sell everything at -30%
  max_prior_peak_mult: 1.1             # skip coins that had already been >10% above the line (not at their high)
  min_rise_2m_pct: 10                  # must be up at least this much over the last 2 minutes (up trajectory)
  min_rise_1m_pct: 0                   # ...and not falling over the last minute
  min_buys_2m: 40                      # ...and at least this many buys in the last 2 minutes (a real crowd)
  breakeven_after_mult: 2              # once a coin has doubled, the stop moves up to break-even (0 = off)
  breakeven_floor_mult: 1.08           # "break-even" incl. fees and price impact
  check_every_s: 3                     # how often prices are checked (faster stops = smaller losses)
  tp_mult: 3                           # sell a third at 3x
  tp_pct: 33.3
  trail_pct: 35                        # after 3x: trailing stop this far below the high
  zone_mcap_sol: 350                   # graduation zone (~8x): sell zone_sell_pct of what's left, before migration
  zone_sell_pct: 66.7
  moon_trail_pct: 25                   # moonbag: tighter trailing stop, and sold below the graduation price
  grad_floor_mcap_sol: 410
  max_hold_h: 48
  # REAL MONEY for this strategy, from its OWN wallet (data/lookalike_wallet/) - separate from copy trading
  real_enabled: false
  real_size_usd: 2.5                   # real buy per coin
  real_max_open: 20                    # max real coins open at once
  real_daily_loss_usd: 25              # stop real buys for the day after losing this much

# ── Breakout recorder (research) ──────────────────────────────
# Records EVERY coin crossing 44 SOL (young and old), holder concentration, a sample of launch
# bundle/sniper checks, every wallet #1 buy with the wallets that bought just before it, and
# 30 min / 2 h / 6 h outcomes -> data/breakouts.jsonl (in the diagnostics zip).
breakouts:
  enabled: true
  dedupe_min: 30                       # one record per coin per 30 minutes
  launch_checks_per_day: 400           # bundle/sniper checks cost one Enhanced call each
  launch_check_share: 0                # 26 Oct: was 0.35 - research done; hold-test buys still get checked (daily launch-type report)
  activity_counts: false               # 26 Oct: trade counts at hold-test buys - no signal in 123 coins, saves Helius credits

# ── Skimmer (PAPER ONLY) ───────────────────────────────────────
# Lots of quick trades: buys every coin rising through 44 SOL (young coins 2+ min old from the live
# feed, older ones from Survivor's list) and sells ALL at +tp_pct, or at -sl_pct, or after max_hold_min.
# ── Reclaim (PAPER ONLY) ────────────────────────────────────────
# Second-wave entries: coins that made a first run, pulled back, and are bouncing with fresh trading.
reclaim:
  stats_since: "2026-09-30"             # results on the dashboard count from this day (older trades stay in the files)
  enabled: false                       # switched off 11 Oct (-$1,900 over 588 paper trades)
  run_mcap_sol: 80                     # a candidate must have reached this market cap while watched
  min_age_min: 30                      # only buy coins at least this old
  pullback_pct: 40                     # ...that fell at least this far from their peak
  bounce_pct: 25                       # ...and have bounced this much off the low since
  max_of_peak_pct: 80                  # ...but are still at most this % of the old peak
  min_of_peak_pct: 55                  # ...and back to at least this % of it (skip crash-then-small-bounce coins)
  be_after_pct: 20                     # once a coin has been up this much, the stop moves to our buy price (0 = off)
  be_floor_mult: 1.05
  bond_exit_mcap_sol: 375              # sell everything at this mcap (just before the curve completes) or on migration
  real_hours_start: 12                 # REAL buys only from noon...
  real_hours_end: 24                   # ...to midnight (this PC's clock). Paper Reclaim still buys 24h. 0/24 = always                  # ...the new stop: +5% over our buy price = about break-even after fees/slippage
  min_entry_mcap_sol: 35
  min_trades_2m: 15                    # activity: at least this many trades in the last 2 minutes
  dead_mcap_sol: 25                    # stop tracking below this
  max_age_h: 6                         # stop tracking candidates older than this
  max_candidates: 400
  size_usd: 25                         # paper size per coin (cheapest size once fees + impact are counted)
  max_open: 100
  stop_pct: 25                         # stop until the coin has been up trail_arm_mult
  trail_arm_mult: 1.5
  trail_pct: 35                        # then trail this far below the highest point
  tp_mult: 3                           # sell tp_frac_pct (1/3) at this multiple (3x since 1 Oct)
  tp_frac_pct: 33.3
  max_hold_h: 24

# ── Reclaim · break-even (PAPER ONLY) ───────────────────────────
# Research (4 Oct): save pump.fun's Explore lists (top market cap / last traded / new) every 5 min - free, best effort
explore:
  enabled: true
  every_s: 300
  limit: 50

# PAPER (5 Oct): Range breakout's buys, but hold for the bonding level (uses the rangebreak buy settings)
rangehold:
  enabled: true
  max_entry_mcap_sol: 250              # only coins still on the curve, well under the bonding level
  bond_exit_mcap_sol: 375              # sell everything here, or if it migrates
  dead_mcap_usd: 4500                  # sell everything if the market cap falls to $4.5K (19 Oct: was $4K - under ~$5K coins
                                       # bonded <1% of the time; no buys within 10% above it)
  late_risers: true                    # also follow coins that wake up 45+ min after launch (from pump.fun's lists)
  stop_pct: 40                         # 18 Oct: was 50 - of ~640 hold trades that fell to -40%, only 5 still bonded
  max_hold_h: 6

# PAPER (6 Oct): same as rangehold, but only coins under $12K market cap (bonding level ~4x+ away)
rangehold_small:                       # the under-$12K test itself was removed 12 Oct; this cap is still used by
  enabled: false                       # the under-$12K / 10-trade tests (rangehold_small10, rangehold_small10t)
  max_entry_mcap_usd: 12000

# PAPER (6 Oct): same as rangehold, but only coins 80 min - 3.2 h old at the breakout (first 39 trades: 85-190 min
# old -> 7 of 21 bonded; younger/older -> 1 of 18)
rangehold_v2:
  enabled: false                       # switched off 16 Oct (owner: remove - weak results; kept for its settings)
  min_age_min: 80
  max_age_h: 3.2

# PAPER (12 Oct): v2 (coins 80 min-3.2 h old), only buys at 85-130 SOL, break-even floor once a coin has doubled
rangehold_v2mid:
  enabled: true
  entry_min_sol: 85
  entry_max_sol: 130
  floor_arm_mult: 2.0
  floor_mult: 1.0

# PAPER (8 Oct): hybrid of v2 and under-$12K - coins 80 min - 3.2 h old AND under $12K at the breakout
rangehold_mix:
  enabled: false                       # switched off 11 Oct (edge faded; replaced by rangehold_small10t)
  min_age_min: 80
  max_age_h: 3.2
  max_entry_mcap_usd: 12000

# PAPER (9 Oct): under-$12K hold test, but only 10 trades / 2 min needed at the breakout (others need 20)
rangehold_small10:
  enabled: true
  min_trades_2m: 10
  real_enabled: false                  # REAL MONEY: also buy every paper buy for real in the real wallet (12 Oct)
  real_size_usd: 10                    # ...this much per coin ($25 13-15 Oct; back to $10 while the market is cold)
  real_max_open: 15                    # ...at most this many open at once
  real_daily_loss_usd: 150             # ...no new real buys after losing this much today ($40 until 13 Oct, $100 until 14 Oct)
  real_test: rangehold_small10d        # 18 Oct (owner): real money follows the 'under 60% of ATH' test (was this one)
  real_auto: true                      # AUTO ON/OFF (16 Oct): with real money on, only buy for real while the market is bonding:
  real_auto_bonds_24h: 2               # ...this test had at least this many bonds among trades closed in the last 24 h
  real_auto_need_green: false          # ...and (if true) was green over those 24 h

# PAPER (16 Oct): the under-$12K / 10-trade test with a 24 h hold instead of 6 h (late bonds vs slow bleed)
rangehold_small10d:                    # PAPER (16 Oct): the 10-trade test, only coins under 60% of their ATH, no chasing past 25%
  enabled: true
  max_pct_of_ath: 60
  max_chase_pct: 25

rangehold_small10dl:                   # PAPER (16 Oct): the under-60%-of-ATH test with a 24 h hold (both ideas together)
  enabled: true
  max_hold_h: 24

rangehold_small10l:
  enabled: true
  max_hold_h: 24

# PAPER (14 Oct): hold-to-bonding, but only when the bond score (6h chance for its mcap + age) is under 0.6x of the
# chance a buy at that price needs to break even - on past trades the low-score buys made the money
rangehold_lowscore:
  enabled: false                       # switched off 16 Oct (owner: remove - weak results; kept for its settings)
  max_score_ratio: 0.6

# PAPER (re-tuned 13 Oct on 192 trades): under-$12K / 10 trades, but only coins 2h+ old and under 80% of their
# all-time high at the breakout, plus a break-even floor once a coin has doubled
rangehold_small10t:
  enabled: true
  min_age_min: 120
  max_pct_of_ath: 80
  floor_arm_mult: 2.0
  floor_mult: 1.0

# PAPER (10 Oct): hold-to-bonding + break-even floor - once a coin hits 2x, sell if it falls back to our buy price
rangehold_floor:
  enabled: false                       # switched off 16 Oct (owner: remove - weak results; kept for its settings)
  floor_arm_mult: 2.0
  floor_mult: 1.0

# Range breakout BUY settings (sideways for a while, then breaks out of the top of the range) - used by the
# hold-to-bonding tests. The original range-breakout test itself was removed on 8 Oct.
rangebreak:
  enabled: true
  size_usd: 25
  run_mcap_sol: 50                     # follow coins that reached this market cap while watched
  max_age_h: 24                        # follow them for up to this long
  max_candidates: 600
  min_age_min: 30                      # only buy coins at least this old
  consol_min: 20                       # sideways for at least this long...
  max_range_pct: 35                    # ...in a range no wider than this (low to high)
  min_entry_mcap_sol: 40               # range bottom at least this
  break_pct: 5                         # buy when this % above the top of the range
  max_chase_pct: 40                    # ...but not if it's already more than this % above it
  min_trades_2m: 20                    # real buying (coins still on the curve)
  recent_s: 90
  sample_s: 20
  dead_mcap_sol: 20
  stop_pct: 25                         # hard stop
  tp_mult: 2                           # sell a third at 2x
  tp_frac_pct: 33.3
  trail_arm_mult: 1.5                  # from 1.5x: trailing stop...
  trail_pct: 30                        # ...30% below the high
  max_hold_h: 24
  max_open: 100

# ── Discord calls (REAL MONEY) ─────────────────────────────────
# Reads the Discord pop-ups Windows shows on this computer (never logs into Discord) and buys every coin
# address in them, in the real (lookalike) wallet. No safety / bundle checks - owner's choice (30 Sep).
calls:
  enabled: true
  real_money: false                    # false = track the calls on paper only (switched off 12 Oct, owner's request)
  read_notifications: true             # read Discord notifications on this computer (Windows)
  apps: ["discord", "telegram"]                 # which apps' notifications count (add "chrome" if you use Discord in a browser)
  channel: ""                          # ONLY buy from this channel: text in the pop-up's title, e.g. "calls" or "alpha-calls"
                                       # (empty = read pop-ups but buy nothing). Set it on the dashboard.
  telegram_channel: ""                 # same for Telegram Desktop pop-ups: the group/channel name in the pop-up title
  telegram_real_money: false           # false = Telegram calls are tracked on PAPER only (Discord calls follow real_money)
  buy_usd: 10
  max_buys_per_day: 10
  max_open: 10                         # real positions open at once
  daily_loss_usd: 50                   # stop buying after losing this much in a day
  auto_sell_on: true                   # master switch: false = the bot never sells call coins by itself (no stop, no 6x/10x)
  stop_pct: 40                         # sell everything at -40%
  auto_take_profit: false              # false = no other automatic sells: you sell calls yourself (Sell button)
  tp6_on: false                        # ...except, if on: sell 1/3 when a call coin reaches 6x
  tp10_on: false                       # ...and, if on: sell half of what's left when it reaches 10x
  tp1_mult: 3                          # sell a quarter at 3x...
  tp2_mult: 5                          # ...another at 5x...
  tp3_mult: 10                         # ...another at 10x
  sell_pct_each: 25
  trail_pct: 50                        # after the first sale, the rest also sells if it falls 50% below its high
  max_hold_h: 48
  max_paper_open: 100
  poll_s: 1

# ── REAL MONEY copy trading ─────────────────────────────────────
# Uses a dedicated trading wallet created in the dashboard (key stays in data/trading_wallet.json).
# Only active while "Start live" is running. Fund the wallet only with what you can afford to lose.
live:
  enabled: false
  trade_usd: 2.5                       # size of each copied buy, in dollars
  budget_usd_per_wallet: 10            # max $ tied up per followed wallet at once; also its loss limit
  max_open_per_wallet: 4
  follow_sells: true                   # sell the same % the followed wallet sells
  buy_slippage_pct: 20
  sell_slippage_pct: 30
  priority_fee_sol: 0.0006             # per transaction (~7 cents); raise if buys "don't confirm"

# Spend guard for metered data. The bot stops watching NEW tokens once this
# many trade messages have been received today (10,000 msgs = 0.01 SOL).
max_trade_messages_per_day: 300000     # ~0.3 SOL/day worst case
max_concurrent_watch: 120              # tokens being watched at once (not yet bought)

# ── Security gate: runs the instant a token launches ────────────
# A token must pass ALL of these before the bot watches it at all, so tokens
# that fail cost nothing in paid data and never appear on the watchlist.
security:
  max_dev_buy_pct: 5                   # dev's launch buy as % of total supply (1 SOL ≈ 3.5%)
  max_launches_per_creator_24h: 2      # creator launched more than this in 24h -> serial launcher, skip
  max_launches_per_creator_7d: 3       # ...or more than this in 7 days (0 = off). Launch history is saved, so restarts
                                       #   don't reset it (data/creator_launches.log)
                                       #   (counts launches seen since the bot started)
  block_repeat_dumpers: true           # creators the bot has seen dump a token are blocked for good
  name_blacklist: ["test", "rug", "scam", "honeypot"]
  rugcheck: true                       # screen every token with RugCheck (free API) before watching
  rugcheck_on_error: skip              # RugCheck down / slow / rate-limited: skip (strict) or allow
  rugcheck_timeout_s: 6
  rugcheck_block_risks:                # fail if any RugCheck risk name contains one of these
    - "freeze authority"
    - "mint authority"
    - "rugged"
    - "copycat"
    - "honeypot"
  rugcheck_max_score: 0                # also fail above this normalised score (0-100). 0 = off,
                                       #   because the score flags almost every brand-new token

# ── Watch window ────────────────────────────────────────────────
watch:
  min_age_s: 30                        # never buy in the first N seconds (snipers' zone)
  max_watch_s: 240                     # give up if no entry signal by then

# ── Entry filters: ALL must pass at the same moment ─────────────
entry:
  min_unique_buyers: 15
  min_buy_count: 20
  min_buy_volume_sol: 5.0
  min_buy_sell_ratio: 1.5              # buy volume / sell volume
  min_mcap_sol: 40
  max_mcap_sol: 300
  max_top_buyer_share_pct: 25          # one wallet (excl. dev) > this % of buy volume -> skip
  momentum_lookback_s: 30
  min_momentum_pct: 15                 # mcap up at least this much over the lookback
  max_drawdown_from_peak_pct: 20       # don't buy something already dumping off its high
  reject_if_dev_sold: true
  # The safety filters above (buyers, volume, mcap range, whale share, drop from peak,
  # dev) are ALWAYS required. On top of them, a token is bought when EITHER trigger fires:
  #   A) momentum:     min_buy_sell_ratio (all-time) + min_momentum_pct over momentum_lookback_s
  #   B) buyer surge:  a burst of NEW buyers, even if early sellers dragged the all-time ratio down
  buyer_surge:
    enabled: true
    window_s: 20                       # look at the last N seconds
    min_new_buyers: 10                 # wallets buying for the first time in that window
    min_recent_buy_sell_ratio: 1.2     # buy vs sell volume in that window only
    min_momentum_pct: 5                # price must still be rising over the window

# ── Exits ───────────────────────────────────────────────────────
exit:
  stop_loss_pct: 30                    # hard stop, measured from entry price
  take_profit:                         # ladder: at +X%, sell Y% of the ORIGINAL position
    - { gain_pct: 50,  sell_pct: 40 }
    - { gain_pct: 150, sell_pct: 30 }
  trailing_stop_pct: 25                # from the peak price since entry
  trailing_arms_after_gain_pct: 30     # trailing stop only active once up this much
  max_hold_s: 900                      # time stop
  stale_after_s: 90                    # no trades for this long = dead token, exit
  exit_on_dev_sell: true

# ── Simulated execution (keep these pessimistic) ────────────────
execution:
  position_size_sol: 0.1
  latency_s: 1.5                       # fill at the first price seen this long after the decision
  platform_fee_pct: 1.25               # pump.fun / PumpSwap fee per side
  priority_fee_sol: 0.0005             # per transaction
  extra_slippage_pct: 2.0              # on top of modelled price impact

# ── Risk limits ─────────────────────────────────────────────────
risk:
  starting_balance_sol: 5.0
  max_open_positions: 3
  daily_loss_limit_sol: 1.0            # stop opening new positions after this much loss in a day

# ── Output ──────────────────────────────────────────────────────
output:
  dir: "data"
  record_raw_events: true              # saves the feed so backtest.py can replay it with new settings

# ── Auto-update ────────────────────────────────────────────────
# When started with start-windows.bat / start-mac.command, the bot checks GitHub for a new
# version and restarts itself to install it (never in the middle of a real buy or sell).
auto_update:
  enabled: true
  check_min: 5                         # how often to check

# ── Phone alerts (ntfy, free) ───────────────────────────────────
# Every REAL buy / sell / close is pushed to the ntfy app. Topic is created once (data/notify_topic.txt) and shown
# on the real wallet card.
# Bond alerts (15 Oct): phone push when bonds come back for 'Hold <$12K · 10 trades' (the real-money strategy)
heat:
  enabled: true
  early_bonds_6h: 2                    # heads-up: this many bonds in the last 6 h
  restart_bonds_24h: 3                 # restart signal: this many bonds in 24 h AND green over those 24 h
  cooldown_h: 12

notify:
  enabled: true
  server: "https://ntfy.sh"
  paper_summary_every_min: 60          # hourly push with every paper test's P&L (quiet, no sound); 0 = off

# RESEARCH (21 Oct): data collectors only - nothing trades. Smart-money wallets (who buys early into coins that
# bond), prices for 24 h after every bond, and second-by-second paths of every coin crossing 44 SOL (30 min).
research2:
  enabled: true
  smart_fetch_per_day: 0               # 26 Oct: was 300 - off (heavy Helius credit use; the "did not bond" sample starved, so no usable test)
  smart_loser_share: 0.12              # share of non-bonding 44-SOL crossers sampled as "did not bond" examples
  smart_early_s: 300                   # buyers within this many seconds of launch count as "early"
  smart_min_bonds: 3                   # a wallet qualifies as smart money with this many early buys in bonders...
  smart_min_share: 0.3                 # ...and at least this share of its recorded early buys bonding
  rocket_window_min: 30                # record each 44-SOL crosser's market cap path for this long
  rocket_sample_s: 3                   # at most one point every this many seconds
  bigcap_every_s: 60                   # DexScreener volume snapshot of every bonded coin worth $50K+ (up to 3 days)

# PAPER (22 Oct, owner's request): bonded/graduated coins at $150K+ whose volume spikes - $25 each, no stop, held 48 h.
# Fed by the research2 big-cap snapshots (DexScreener every minute). Never real money.
bigcap_paper:
  enabled: true
  size_usd: 25
  hold_h: 48
  min_mc_usd: 150000
  max_mc_usd: 5000000
  spike_mult: 2.0                      # 5-min volume at least this x its average 5-min volume over the last hour
  min_v5_usd: 3000                     # ...and at least this much in those 5 minutes
  min_liq_usd: 40000                   # 23 Oct: was 15K
  min_hours_since_bond: 6              # 23 Oct: skip coins that bonded less than 6 h ago (v1: 237 of 261 such buys rugged)
  min_hist_mult: 1.5                   # 26 Oct (v3): last hour's volume >= 1.5x the last 5 min's (the coin traded before the spike)...
  min_day_mult: 2.0                    # ...and 24h volume >= 2x the last hour's - skips brand-new pairs (v2: 42 of 50 rugged)
  fee_pct: 2                           # charged on the buy and on the sell
